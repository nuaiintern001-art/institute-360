
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institute 360 - Your AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">
            <div class="brand">
                <div class="brand-icon">✦</div>
                <span>Institute 360</span>
            </div>

            <button class="icon-btn" id="closeSidebar"
                    title="Close sidebar">✕</button>
        </div>

        <button class="new-chat-btn" id="newChat">
            <span>＋</span>
            <span>New Chat</span>
        </button>

        <div class="search-wrapper">
            <span>⌕</span>
            <input type="text" id="searchChats"
                   placeholder="Search conversations">
        </div>

        <div class="sidebar-section">
            <p class="section-title">YOUR CHATS</p>
            <div id="chatHistory" class="chat-history"></div>
        </div>

        <div class="sidebar-bottom">

            <button class="sidebar-option" id="themeBtn">
                <span id="themeIcon">☾</span>
                <span id="themeText">Dark mode</span>
            </button>

            <div class="profile">
                <div class="profile-avatar">U</div>
                <div class="profile-details">
                    <strong>My Account</strong>
                    <span>Personal workspace</span>
                </div>
                <span class="profile-dots">•••</span>
            </div>

        </div>

    </aside>

    <!-- MOBILE OVERLAY -->
    <div class="overlay" id="overlay"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">

            <div class="topbar-left">
                <button class="icon-btn menu-btn" id="menuBtn"
                        title="Toggle sidebar">☰</button>

                <div class="mobile-brand">Institute 360</div>
            </div>

            <div class="topbar-right">
                <span class="model-label">
                    <span class="status-dot"></span>
                    AI Assistant
                </span>
            </div>

        </header>

        <!-- CHAT AREA -->
        <section class="chat-area" id="chatArea">

            <!-- WELCOME SCREEN -->
            <div class="welcome" id="welcome">

                <div class="welcome-icon">✦</div>

                <p class="welcome-label">YOUR PERSONAL AI ASSISTANT</p>

                <h1>What can I help you with?</h1>

                <p class="welcome-description">
                    Ask questions, explore ideas, or get help
                    with anything you're working on.
                </p>

                <div class="suggestions">

                    <button class="suggestion" data-prompt="Explain Artificial Intelligence in simple words">
                        <span class="suggestion-icon">✧</span>
                        <span>
                            <strong>Learn something</strong>
                            <small>Explain a new topic</small>
                        </span>
                    </button>

                    <button class="suggestion" data-prompt="Give me some creative project ideas">
                        <span class="suggestion-icon">⌘</span>
                        <span>
                            <strong>Generate ideas</strong>
                            <small>Explore creative ideas</small>
                        </span>
                    </button>

                    <button class="suggestion" data-prompt="Help me write a professional email">
                        <span class="suggestion-icon">✎</span>
                        <span>
                            <strong>Write something</strong>
                            <small>Emails and documents</small>
                        </span>
                    </button>

                    <button class="suggestion" data-prompt="Help me understand Python programming">
                        <span class="suggestion-icon">⌨</span>
                        <span>
                            <strong>Write code</strong>
                            <small>Learn and debug code</small>
                        </span>
                    </button>

                </div>

            </div>

            <!-- MESSAGES -->
            <div class="messages" id="messages"></div>

        </section>

        <!-- INPUT SECTION -->
        <footer class="input-area">

            <div class="input-container">

                <input type="file" id="fileInput" hidden>

                <button class="input-action" id="attachBtn"
                        title="Attach a file">＋</button>

                <textarea
                    id="userInput"
                    rows="1"
                    placeholder="Message Institute 360..."
                ></textarea>

                <button class="input-action voice-btn" id="voiceBtn"
                        title="Voice input">♩</button>

                <button class="send-btn" id="sendBtn"
                        title="Send message">↑</button>

            </div>

            <div class="attachment-info" id="attachmentInfo"></div>

            <p class="disclaimer">
                Institute 360 can make mistakes. Verify important information.
            </p>

        </footer>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
